<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --green: #8EC641; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d0d0d; color: #f2f2f2; font-family: Inter, system-ui, sans-serif; padding: 40px 16px 80px; }
  header { max-width: 1400px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
  h1 { font-family: Oswald, 'Arial Narrow', sans-serif; text-transform: uppercase; font-size: 34px; letter-spacing: 1px; }
  h1 span { color: var(--green); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #1d1d1d; color: #eee; border: 1px solid #333; padding: 8px 16px; font: 600 14px Inter, sans-serif; cursor: pointer; }
  button.on { background: var(--green); color: #000; border-color: var(--green); }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 26px; }
  .card a { color: inherit; text-decoration: none; }
  .frame { position: relative; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #2a2a2a;
    background: repeating-conic-gradient(#2a2a2a 0 25%, #1e1e1e 0 50%) 0 0 / 24px 24px; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .card h2 { margin-top: 10px; font-size: 16px; } .card p { font-size: 13px; color: #9a9a9a; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <h1>New Life Church <span>Overlay Pack</span></h1>
  <a href="10-control-panel.html" target="_blank" style="color:var(--green);font-weight:600;text-decoration:none">Open live control panel →</a>
  <div class="controls">
    <button data-lang="en" class="on">English</button><button data-lang="es">Español</button>
    <button data-key="magenta" class="on">Magenta key</button><button data-key="off">Transparent</button>
  </div>
</header>
<div class="grid" id="grid"></div>
<script>
  const S = 'speaker_name=Pastor+Name&speaker_title=Lead+Pastor&message_title=Grace+Upon+Grace&series_name=The+Gospel+of+John&book=John&chapter=1&verse=16';
  const items = [
    ['01-starting-soon.html', 'Starting Soon', 'Full screen · countdown', 'minutes=5'],
    ['02-camera-fullscreen.html', 'Camera – Full Screen', 'Camera behind key colour · church tag + LIVE', ''],
    ['03-camera-sermon.html', 'Camera – Sermon', 'Camera 1280×720 · message panel', S],
    ['04-camera-slides.html', 'Camera + Slides', 'Camera 592×333 · slides 1148×646', S],
    ['05-lower-third-speaker.html', 'Lower Third – Speaker', 'Transparent · speaker name + title', S],
    ['06-be-right-back.html', 'Be Right Back', 'Full screen', ''],
    ['07-thank-you.html', 'Thank You', 'Full screen · optional giving link', 'give_url=yourwebsite.org/give'],
    ['08-lower-third-verse.html', 'Lower Third – Verse', 'Transparent · looks up the verse text online', 'book=John&chapter=3&verse=16'],
  ];
  let lang = 'en', key = 'magenta';
  const grid = document.getElementById('grid');
  function render() {
    grid.innerHTML = items.map(([f, t, d, x]) => {
      const url = `${f}?lang=${lang}&key=${key}${x ? '&' + x : ''}`;
      return `<div class="card"><a href="${url}" target="_blank"><div class="frame"><iframe src="${url}" loading="lazy" title="${t}"></iframe></div><h2>${t}</h2><p>${d}</p></a></div>`;
    }).join('');
    scale();
  }
  function scale() { document.querySelectorAll('.frame').forEach(fr => fr.querySelector('iframe').style.transform = `scale(${fr.clientWidth / 1920})`); }
  addEventListener('resize', scale);
  document.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.lang) { lang = b.dataset.lang; document.querySelectorAll('[data-lang]').forEach(x => x.classList.toggle('on', x === b)); }
    else { key = b.dataset.key; document.querySelectorAll('[data-key]').forEach(x => x.classList.toggle('on', x === b)); }
    render();
  });
  render();
</script>
</body>
</html>
